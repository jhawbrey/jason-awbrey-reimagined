name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build:static

      - name: Verify static images
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path('.output/public').resolve()

          class Images(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag != 'img':
                      return
                  src = dict(attrs).get('src', '')
                  url = urlsplit(src)
                  if url.scheme or url.netloc:
                      return
                  assert src, f'Empty image source in {page}'
                  path = unquote(url.path)
                  assert not path.startswith('/__l5e/'), f'Preview-only image in {page}: {src}'
                  target = root / path.lstrip('/') if path.startswith('/') else page.parent / path
                  assert target.is_file(), f'Missing deployed image in {page}: {src}'

          pages = list(root.rglob('*.html'))
          assert pages, 'No prerendered pages found'
          for page in pages:
              Images().feed(page.read_text())
          assert (root / 'images/jasonawbrey-sq-hp.jpg').is_file(), 'Homepage portrait missing'
          print('All local images are included in the Pages artifact.')
          PY

      - name: Prepare GitHub Pages output
        run: |
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll
          echo "jasonawbrey.com" > .output/public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
